name: low-resource performance

on:
  push:
    branches:
      - perf/low-resource-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 8379e184b6d8eefccfb737411015b09308666372
    steps:
      - name: Checkout optimized branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate device profiler
        run: |
          sh -n tools/profile-device.sh
          rm -rf /tmp/pmjs-device-profile-smoke
          sh tools/profile-device.sh --no-perf -i 0.1 -o /tmp/pmjs-device-profile-smoke -- sh -c 'sleep 0.35'
          test -s /tmp/pmjs-device-profile-smoke/samples.csv
          test -s /tmp/pmjs-device-profile-smoke/summary.txt
          grep -q '^exit_code=0$' /tmp/pmjs-device-profile-smoke/summary.txt

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb pkg-config libnode-dev \
            libsdl2-dev libegl1-mesa-dev libgles2-mesa-dev \
            libpng-dev libjpeg-dev libfreetype6-dev libharfbuzz-dev \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev

      - name: Prepare baseline worktree
        run: |
          git worktree add /tmp/pmjs-base "$BASE_SHA"

      - name: Configure baseline and optimized builds
        run: |
          cmake -S /tmp/pmjs-base -B /tmp/pmjs-base/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build baseline and optimized versions
        run: |
          cmake --build /tmp/pmjs-base/build --target pmjs_native -j2
          cmake --build "$GITHUB_WORKSPACE/build" -j2

      - name: Record native binary sizes
        run: |
          stat -c '%s' /tmp/pmjs-base/build/pmjs_native.node > /tmp/native-size-before.txt
          stat -c '%s' "$GITHUB_WORKSPACE/build/pmjs_native.node" > /tmp/native-size-after.txt

      - name: Run optimized test suite
        run: |
          ctest --test-dir "$GITHUB_WORKSPACE/build" --output-on-failure -j2

      - name: Benchmark scheduler before and after
        run: |
          git show "$BASE_SHA:js/pmjs-web/scheduler.js" > /tmp/base-scheduler.js
          node --expose-gc tools/perf/scheduler-bench.cjs /tmp/base-scheduler.js 500000 | tee /tmp/scheduler-before.json
          node --expose-gc tools/perf/scheduler-bench.cjs js/pmjs-web/scheduler.js 500000 | tee /tmp/scheduler-after.json

      - name: Benchmark RPG Maker input bridge before and after
        run: |
          git show "$BASE_SHA:js/pmjs-rpgmaker/input.js" > /tmp/input-before.js
          node --expose-gc tools/perf/input-bridge-bench.cjs /tmp/input-before.js 300000 | tee /tmp/input-before.json
          node --expose-gc tools/perf/input-bridge-bench.cjs js/pmjs-rpgmaker/input.js 300000 | tee /tmp/input-after.json

      - name: Benchmark web runtime gamepad bridge before and after
        run: |
          git show "$BASE_SHA:js/pmjs-web/runtime.js" > /tmp/runtime-before.js
          node --expose-gc tools/perf/runtime-input-bench.cjs /tmp/runtime-before.js 200000 | tee /tmp/runtime-input-before.json
          node --expose-gc tools/perf/runtime-input-bench.cjs js/pmjs-web/runtime.js 200000 | tee /tmp/runtime-input-after.json

      - name: Build audio worker benchmark
        shell: bash
        run: |
          set -euo pipefail
          FLAGS="$(pkg-config --cflags --libs \
            sdl2 egl glesv2 libpng libjpeg freetype2 harfbuzz \
            libavformat libavcodec libavutil libswresample libswscale)"
          c++ -O2 -std=c++20 -I/tmp/pmjs-base/src \
            tools/perf/audio-worker-bench.cpp /tmp/pmjs-base/build/libpmjs_runtime.a \
            $FLAGS -lm -ldl -pthread -o /tmp/audio-before
          c++ -O2 -std=c++20 -I"$GITHUB_WORKSPACE/src" \
            tools/perf/audio-worker-bench.cpp "$GITHUB_WORKSPACE/build/libpmjs_runtime.a" \
            $FLAGS -lm -ldl -pthread -o /tmp/audio-after

      - name: Benchmark audio worker before and after
        run: |
          : > /tmp/audio-before.jsonl
          : > /tmp/audio-after.jsonl
          for i in 1 2 3; do /tmp/audio-before | tee -a /tmp/audio-before.jsonl; done
          for i in 1 2 3; do /tmp/audio-after | tee -a /tmp/audio-after.jsonl; done

      - name: Benchmark native hot paths before and after
        run: |
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
            node --expose-gc tools/perf/native-hotpath-bench.cjs \
            /tmp/pmjs-base/build/pmjs_native.node /tmp/pmjs-base/build/test-assets \
            | tee /tmp/native-before.json
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
            node --expose-gc tools/perf/native-hotpath-bench.cjs \
            "$GITHUB_WORKSPACE/build/pmjs_native.node" "$GITHUB_WORKSPACE/build/test-assets" \
            | tee /tmp/native-after.json

      - name: Benchmark native steady-state frame loop before and after
        run: |
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
            node --expose-gc tools/perf/steady-state-bench.cjs \
            /tmp/pmjs-base/build/pmjs_native.node /tmp/pmjs-base/build/test-assets 10000 \
            | tee /tmp/steady-before.json
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
            node --expose-gc tools/perf/steady-state-bench.cjs \
            "$GITHUB_WORKSPACE/build/pmjs_native.node" "$GITHUB_WORKSPACE/build/test-assets" 10000 \
            | tee /tmp/steady-after.json

      - name: Summarize benchmark deltas
        run: |
          python3 - <<'PY'
          import json, statistics

          def load(path):
              # Native benchmarks may emit SDL/ALSA diagnostics before their
              # machine-readable result. Read the last JSON object rather than
              # requiring the whole stdout capture to be JSON.
              with open(path) as f:
                  lines = [line.strip() for line in f if line.strip()]
              for line in reversed(lines):
                  if line.startswith('{'):
                      return json.loads(line)
              raise RuntimeError(f'no JSON result in {path}')

          def pct(before, after):
              return (after / before - 1.0) * 100.0 if before else 0.0

          before = load('/tmp/scheduler-before.json')
          after = load('/tmp/scheduler-after.json')
          print('=== scheduler ===')
          print(f"before {before['median_ns_per_frame']:.1f} ns/frame")
          print(f"after  {after['median_ns_per_frame']:.1f} ns/frame")
          print(f"delta  {pct(before['median_ns_per_frame'], after['median_ns_per_frame']):+.1f}%")
          if 'raf_median_ns_per_frame' in before and 'raf_median_ns_per_frame' in after:
              print(f"raf/frame: before={before['raf_median_ns_per_frame']:.1f} after={after['raf_median_ns_per_frame']:.1f} delta={pct(before['raf_median_ns_per_frame'], after['raf_median_ns_per_frame']):+.1f}%")
          if 'timer_median_ns_per_tick' in before and 'timer_median_ns_per_tick' in after:
              print(f"due interval: before={before['timer_median_ns_per_tick']:.1f} after={after['timer_median_ns_per_tick']:.1f} delta={pct(before['timer_median_ns_per_tick'], after['timer_median_ns_per_tick']):+.1f}%")
          if 'stalled_interval_median_ns_per_tick' in before and 'stalled_interval_median_ns_per_tick' in after:
              print(f"stalled interval: before={before['stalled_interval_median_ns_per_tick']:.1f} after={after['stalled_interval_median_ns_per_tick']:.1f} delta={pct(before['stalled_interval_median_ns_per_tick'], after['stalled_interval_median_ns_per_tick']):+.1f}%")

          before_input = load('/tmp/input-before.json')
          after_input = load('/tmp/input-after.json')
          print('=== RPG Maker input bridge ===')
          print(f"before {before_input['median_ns_per_update']:.1f} ns/update")
          print(f"after  {after_input['median_ns_per_update']:.1f} ns/update")
          print(f"delta  {pct(before_input['median_ns_per_update'], after_input['median_ns_per_update']):+.1f}%")
          print(f"heap churn median: before={before_input['median_heap_delta_kb']:.1f} KiB after={after_input['median_heap_delta_kb']:.1f} KiB")

          before_runtime = load('/tmp/runtime-input-before.json')
          after_runtime = load('/tmp/runtime-input-after.json')
          print('=== web runtime gamepad bridge ===')
          for mode in ('steady', 'edge'):
              bv = before_runtime[mode]['median_ns_per_update']
              av = after_runtime[mode]['median_ns_per_update']
              print(f"{mode}: before={bv:.1f} ns after={av:.1f} ns delta={pct(bv,av):+.1f}%")
              print(f"{mode} heap delta: before={before_runtime[mode]['median_heap_delta_kb']:.1f} KiB after={after_runtime[mode]['median_heap_delta_kb']:.1f} KiB")

          def jsonl(path):
              with open(path) as f:
                  return [json.loads(line) for line in f if line.strip().startswith('{')]
          b = jsonl('/tmp/audio-before.jsonl')
          a = jsonl('/tmp/audio-after.jsonl')
          print('=== audio worker ===')
          for key in ('idle_cpu_ms', 'streaming_cpu_ms'):
              bv = statistics.median(x[key] for x in b)
              av = statistics.median(x[key] for x in a)
              print(f"{key}: before={bv:.3f} after={av:.3f} delta={pct(bv,av):+.1f}%")
          before_frames = statistics.median(x['buffered_frames'] for x in b)
          after_frames = statistics.median(x['buffered_frames'] for x in a)
          print(f"buffered_frames: before={before_frames:.0f} after={after_frames:.0f} delta={pct(before_frames,after_frames):+.1f}%")
          print(f"stream_buffer_kib: before={before_frames * 2 * 4 / 1024:.1f} after={after_frames * 2 * 4 / 1024:.1f}")

          b = load('/tmp/native-before.json')
          a = load('/tmp/native-after.json')
          bm = {x['benchmark']: x['median_us_per_op'] for x in b['results']}
          am = {x['benchmark']: x['median_us_per_op'] for x in a['results']}
          print('=== native hot paths ===')
          for name in bm:
              print(f"{name}: before={bm[name]:.3f} us after={am[name]:.3f} us delta={pct(bm[name],am[name]):+.1f}%")
          if 'startup_render_target_bytes' in b and 'startup_render_target_bytes' in a:
              before_mb = b['startup_render_target_bytes'] / (1024 * 1024)
              after_mb = a['startup_render_target_bytes'] / (1024 * 1024)
              print(f"render_targets_startup_mb: before={before_mb:.3f} after={after_mb:.3f} delta={pct(before_mb,after_mb):+.1f}%")
          with open('/tmp/native-size-before.txt') as f:
              before_size = int(f.read().strip())
          with open('/tmp/native-size-after.txt') as f:
              after_size = int(f.read().strip())
          print(f"native_binary_mb: before={before_size/(1024*1024):.3f} after={after_size/(1024*1024):.3f} delta={pct(before_size,after_size):+.1f}%")
          print(f"rss_mb: before={b['rss_mb']:.1f} after={a['rss_mb']:.1f} delta={pct(b['rss_mb'],a['rss_mb']):+.1f}%")

          sb = load('/tmp/steady-before.json')
          sa = load('/tmp/steady-after.json')
          print('=== native steady-state frame loop ===')
          for key in ('wall_us_per_frame', 'cpu_us_per_frame'):
              print(f"{key}: before={sb[key]:.3f} after={sa[key]:.3f} delta={pct(sb[key],sa[key]):+.1f}%")
          print(f"rss drift MB: before={sb['rss_drift_mb']:.3f} after={sa['rss_drift_mb']:.3f}")
          PY

      - name: Runner information
        if: always()
        run: |
          lscpu | sed -n '1,20p'
          free -h
 /tmp/pmjs-device-profile-smoke/summary.txt

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb pkg-config libnode-dev \
            libsdl2-dev libegl1-mesa-dev libgles2-mesa-dev \
