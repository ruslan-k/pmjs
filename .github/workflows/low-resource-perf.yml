          stat -c '%s' "$GITHUB_WORKSPACE/build/pmjs_native.node" > /tmp/native-size-after.txt

      - name: Run optimized test suite
        run: |
          ctest --test-dir "$GITHUB_WORKSPACE/build" --output-on-failure -j2

      - name: Benchmark scheduler before and after
        run: |
          git show "$BASE_SHA:js/pmjs-web/scheduler.js" > /tmp/base-scheduler.js
          node --expose-gc tools/perf/scheduler-bench.cjs /tmp/base-scheduler.js 500000 | tee /tmp/scheduler-before.json
          node --expose-gc tools/perf/scheduler-bench.cjs js/pmjs-web/scheduler.js 500000 | tee /tmp/scheduler-after.json

      - name: Benchmark RPG Maker input bridge before and after
