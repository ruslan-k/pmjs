          node --expose-gc tools/perf/runtime-input-bench.cjs /tmp/runtime-before.js 200000 | tee /tmp/runtime-input-before.json
          node --expose-gc tools/perf/runtime-input-bench.cjs js/pmjs-web/runtime.js 200000 | tee /tmp/runtime-input-after.json

